name: Naver Review Daily Collector

on:
  # 한국시간 오전 7:10 = UTC 전날 22:10
  # 정각은 GitHub 스케줄 부하가 몰릴 수 있어 10분으로 설정.
  schedule:
    - cron: "10 22 * * *"

  # GitHub Actions 화면에서 수동 실행 가능
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Collect Naver reviews
        env:
          APPS_SCRIPT_WEBAPP_URL: ${{ secrets.APPS_SCRIPT_WEBAPP_URL }}
          INBOUND_TOKEN: ${{ secrets.INBOUND_TOKEN }}
          LATEST_LIMIT: "200"
          RECOMMEND_LIMIT: "50"
        run: python collector.py
