name: Naver Review Daily Collector

on:
  schedule:
    # Korea 07:10 = UTC 22:10 (previous day)
    - cron: "10 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Validate collector entrypoint
        run: |
          python -m py_compile collector.py
          grep -q 'if __name__ == "__main__":' collector.py
          grep -q 'sys.exit(main())' collector.py
          echo "collector.py syntax + main entrypoint OK"

      - name: Collect Naver reviews
        env:
          APPS_SCRIPT_WEBAPP_URL: ${{ secrets.APPS_SCRIPT_WEBAPP_URL }}
          INBOUND_TOKEN: ${{ secrets.INBOUND_TOKEN }}
          LATEST_LIMIT: "200"
          LATEST_RESCAN_LIMIT: "100"
          RECOMMEND_LIMIT: "50"
          PYTHONUNBUFFERED: "1"
        run: python collector.py

      # If Naver changes its DOM, these files let us inspect the exact rendered page.
      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: naver-review-debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 7
